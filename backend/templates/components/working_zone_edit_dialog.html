<!-- Working zone edit dialog: value 1 or 0 for points inside the zone -->
<div id="workingZoneEditDialog" class="dialog-overlay" style="display: none;">
    <div class="dialog">
        <h3 data-i18n="dialog.workingZoneEdit.title">Working zone for points inside the area</h3>
        <p class="dialog-description" data-i18n="dialog.workingZoneEdit.description">Choose the working_zone value for all points inside the drawn area.</p>
        <div class="dialog-actions flex-wrap">
            <button id="workingZoneEditSet1" class="btn btn-primary">
                <i class="material-icons">check_circle</i>
                <span data-i18n="dialog.workingZoneEdit.set1">Working zone (1)</span>
            </button>
            <button id="workingZoneEditSet0" class="btn btn-outline">
                <i class="material-icons">cancel</i>
                <span data-i18n="dialog.workingZoneEdit.set0">Outside zone (0)</span>
            </button>
            <button id="workingZoneEditCancel" class="btn btn-secondary" data-i18n="dialog.fillParcel.cancel">Cancel</button>
        </div>
    </div>
</div>
