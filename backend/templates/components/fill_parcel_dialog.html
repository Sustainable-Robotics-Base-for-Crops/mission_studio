<!-- Parcel fill dialog -->
<div id="fillParcelDialog" class="dialog-overlay" style="display: none;">
    <div class="dialog">
        <h3 data-i18n="dialog.fillParcel.title">Fill parcel</h3>
        <div class="form-group">
            <label for="rowSpacing" data-i18n="dialog.fillParcel.rowSpacing">Row spacing (m):</label>
            <input type="number" id="rowSpacing" step="0.1" value="2.5">
        </div>
        <div class="dialog-actions">
            <button id="fillParcelConfirm" class="btn btn-primary" data-i18n="dialog.fillParcel.confirm">Fill</button>
            <button id="fillParcelCancel" class="btn btn-secondary" data-i18n="dialog.fillParcel.cancel">Cancel</button>
        </div>
    </div>
</div>
