<!-- Search container -->
<div class="search-container">
    <div class="search-box" id="searchBox">
        <i class="material-icons search-icon search-toggle" id="searchToggle" aria-label="" data-i18n-aria-label="search.toggle">search</i>
        <div class="search-input-wrapper">
            <input type="text" id="locationSearch" placeholder="" data-i18n-placeholder="search.placeholder">
            <button id="searchBtn" class="search-btn" aria-label="" data-i18n-aria-label="search.button">
                <i class="material-icons">arrow_forward</i>
            </button>
        </div>
        <div id="searchSuggestions" class="search-suggestions" role="listbox" aria-label="Search results"></div>
    </div>
    <!-- Geolocation button (user position) -->
    <button id="geolocationBtn" class="geolocation-btn" aria-label="" data-i18n-aria-label="search.geolocation" title="" data-i18n-title="search.geolocation">
        <i class="material-icons">my_location</i>
    </button>
</div>
