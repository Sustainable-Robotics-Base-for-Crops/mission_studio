<!-- Load dialog -->
<div id="loadDialog" class="dialog-overlay" style="display: none;">
    <div class="dialog">
        <h3 data-i18n="loadDialog.title">Load a trajectory</h3>
        <!-- Progress view -->
        <div id="loadDialogProgress" class="load-progress">
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
            <p class="progress-text" id="progressText" data-i18n="loadDialog.progress.loading">Loading...</p>
        </div>
        <div id="trajectoriesList" class="trajectories-list">
            <!-- Trajectories will be listed here -->
        </div>
        <div class="dialog-actions">
            <button id="loadDialogCancel" class="btn btn-secondary" data-i18n="dialog.fillParcel.cancel">Cancel</button>
        </div>
    </div>
</div>
