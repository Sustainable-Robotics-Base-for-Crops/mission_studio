<!-- Confirmation dialog -->
<div id="confirmDialog">
    <div>
        <h3 id="confirmTitle" data-i18n="confirm.title">Confirmation</h3>
        <p id="confirmMessage"></p>
        <div class="dialog-actions">
            <button id="confirmCancel" class="btn btn-secondary" data-i18n="confirm.cancel">Cancel</button>
            <button id="confirmOk" class="btn btn-primary" data-i18n="confirm.ok">Confirm</button>
        </div>
    </div>
</div>
