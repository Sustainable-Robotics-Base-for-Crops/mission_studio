name: CI

on:
  push:
    branches: [main, 'develop/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python — lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      # Formatting is enforced on new code only; see the note in pyproject.toml.
      - name: Format check (ruff)
        run: ruff format --check tests scripts

      - name: Tests (pytest)
        run: pytest --cov=backend --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: ignore

  javascript:
    name: JavaScript — lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck
        run: npx tsc --noEmit -p frontend/tsconfig.json

      - name: Lint (eslint)
        run: npx eslint .

      - name: Format check (prettier)
        run: npx prettier --check "tests/js/**/*.{js,ts,tsx}" "frontend/src/**/*.{ts,tsx,css}"

      - name: Tests (vitest)
        run: npx vitest run

      - name: Build Mission Studio
        run: npm run build

  contracts:
    name: Contracts — Agri schema and application startup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install JavaScript dependencies and build the studio shell
        run: |
          npm ci || npm install
          npm run build

      - name: Application starts and serves the editor
        run: python scripts/smoke_server.py
